openapi: 3.1.0
info:
  title: NeuroGateway slice
  version: 0.5.0
  description: |
    Один метод Release 0.5. Стриминг, fallback и эквайринг в этот файл не входят.
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: X-Generation-Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Ответ модели и одно списание
          headers:
            X-Request-Id:
              schema:
                type: string
            X-Generation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '400':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: invalid_api_key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: insufficient_balance, провайдер не вызывается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: forbidden или moderation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: model_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: context_length_exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Тело не JSON
        '429':
          description: rate_limit, metadata.limit_source = gateway или provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: provider_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: no_available_provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/credits:
    get:
      operationId: getCredits
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Баланс, бонусы и расход за период
          content:
            application/json:
              schema:
                type: object
                required: [balance, bonus, used]
                properties:
                  balance:
                    type: integer
                    description: Доступно на кошельке, minor
                  bonus:
                    type: integer
                  used:
                    type: integer
  /v1/key:
    get:
      operationId: getKey
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Лимит ключа, остаток, сброс периода и лимит частоты
          content:
            application/json:
              schema:
                type: object
                required: [limit, used, remain, hard]
                properties:
                  limit:
                    type: integer
                  used:
                    type: integer
                  remain:
                    type: integer
                  reset:
                    type: string
                    format: date-time
                  hard:
                    type: boolean
                  tier:
                    type: string
                  rate_limit:
                    type: integer
  /v1/activity:
    get:
      operationId: listActivity
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: query
          name: model
          schema:
            type: string
        - in: query
          name: key
          schema:
            type: string
      responses:
        '200':
          description: Страница журнала своей организации, без текста запроса
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, param]
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
              enum: [invalid_request, invalid_api_key, insufficient_balance, forbidden, moderation, model_not_found, timeout, context_length_exceeded, rate_limit, provider_error, no_available_provider]
            param:
              type: [string, 'null']
            metadata:
              type: object
              properties:
                provider:
                  type: string
                raw:
                  type: string
                  description: Ответ провайдера без ключей и токенов, не длиннее 512 байт
                limit_source:
                  type: string
                  enum: [gateway, provider]
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
    ChatCompletionResponse:
      type: object
      required: [id, model, choices]
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required: [message]
            properties:
              message:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                  content:
                    type: string
