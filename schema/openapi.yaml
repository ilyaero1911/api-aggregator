openapi: 3.1.0
info:
  title: NeuroGateway slice
  version: 0.5.0
  description: |
    Один метод Release 0.5. Стриминг, fallback и эквайринг в этот файл не входят.
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: X-Generation-Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Ответ модели и одно списание
          headers:
            X-Request-Id:
              schema:
                type: string
            X-Generation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '402':
          description: Баланса не хватает, провайдер не вызывается
        '415':
          description: Тело не JSON
  /v1/credits:
    get:
      operationId: getCredits
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Баланс, бонусы и расход за период
          content:
            application/json:
              schema:
                type: object
                required: [balance, bonus, used]
                properties:
                  balance:
                    type: integer
                    description: Доступно на кошельке, minor
                  bonus:
                    type: integer
                  used:
                    type: integer
  /v1/key:
    get:
      operationId: getKey
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Лимит ключа, остаток, сброс периода и лимит частоты
          content:
            application/json:
              schema:
                type: object
                required: [limit, used, remain, hard]
                properties:
                  limit:
                    type: integer
                  used:
                    type: integer
                  remain:
                    type: integer
                  reset:
                    type: string
                    format: date-time
                  hard:
                    type: boolean
                  tier:
                    type: string
                  rate_limit:
                    type: integer
  /v1/activity:
    get:
      operationId: listActivity
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: query
          name: model
          schema:
            type: string
        - in: query
          name: key
          schema:
            type: string
      responses:
        '200':
          description: Страница журнала своей организации, без текста запроса
components:
  schemas:
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
    ChatCompletionResponse:
      type: object
      required: [id, model, choices]
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required: [message]
            properties:
              message:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                  content:
                    type: string
