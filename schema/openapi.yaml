openapi: 3.1.0
info:
  title: NeuroGateway slice
  version: 0.5.0
  description: |
    Один метод Release 0.5. Стриминг, fallback и эквайринг в этот файл не входят.
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: X-Generation-Id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Ответ модели и одно списание
          headers:
            X-Request-Id:
              schema:
                type: string
            X-Generation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '402':
          description: Баланса не хватает, провайдер не вызывается
        '415':
          description: Тело не JSON
components:
  schemas:
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
    ChatCompletionResponse:
      type: object
      required: [id, model, choices]
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required: [message]
            properties:
              message:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                  content:
                    type: string
